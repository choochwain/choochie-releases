<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Choochie usage</title>
<link rel="icon" type="image/png" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
  body{min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .top h1{font-size:clamp(26px,4vw,36px);color:var(--cream);margin:0}
  .top .meta{color:var(--faint);font-size:13px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn-sm{padding:8px 14px;font-size:13px}
  .card{background:var(--surface);border:1px solid var(--stroke);border-radius:18px;padding:16px}
  .login{max-width:420px;margin:12vh auto 0;text-align:center}
  .login h1{color:var(--cream)}
  .login input{width:100%;margin:14px 0 10px;padding:12px 14px;border-radius:12px;border:1px solid var(--stroke);background:var(--surface2);color:var(--text);font:600 15px var(--body)}
  .login input:focus{outline:2px solid var(--red);outline-offset:1px}
  .msg{min-height:22px;color:var(--rose);font-weight:600;font-size:14px;margin-top:8px}
  .grid{display:grid;gap:12px}
  .kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin-bottom:12px}
  .kpi .label{color:var(--dim);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .kpi .val{font-family:var(--display);font-weight:800;font-size:28px;color:var(--cream);line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .note{color:var(--faint);font-size:12px;margin-top:2px}
  .bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--red));border-radius:99px}
  .bar.warn i{background:linear-gradient(90deg,var(--red-light),var(--red-dark))}
  .two{grid-template-columns:2fr 1fr;margin-bottom:12px}
  @media (max-width:820px){.two{grid-template-columns:1fr}}
  h2.card-h{font-size:18px;color:var(--cream);margin:0 0 10px;font-family:var(--display)}
  .legend{display:flex;gap:14px;color:var(--dim);font-size:12px;margin-bottom:6px;flex-wrap:wrap}
  .legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  svg text{fill:var(--faint);font:600 10px var(--body)}
  .rows{display:grid;gap:8px}
  .row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;font-size:14px}
  .row span:first-child{color:var(--dim)}
  .row span:last-child{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
  .mini{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;grid-column:1/-1}
  .mini i{display:block;height:100%;background:var(--rose)}
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--stroke);white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--dim);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;background:var(--surface)}
  tr:hover td{background:rgba(255,92,138,.04)}
  .est{color:var(--faint);font-size:12px;margin-top:10px}
  .hidden{display:none}
  .banner{background:rgba(224,38,58,.12);border:1px solid rgba(224,38,58,.35);color:var(--rose-soft);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">

  <section id="login" class="login card">
    <h1>Usage</h1>
    <p class="fine">Admin only. The code stays in this browser tab and is checked by the server.</p>
    <form id="login-form" autocomplete="off">
      <input id="code" type="password" placeholder="Admin code" aria-label="Admin code" required>
      <button class="btn btn-primary" type="submit" style="width:100%">Open dashboard</button>
    </form>
    <div id="login-msg" class="msg" role="status"></div>
  </section>

  <section id="dash" class="hidden" aria-live="polite">
    <div class="top">
      <div>
        <h1>Choochie usage</h1>
        <div class="meta" id="meta">-</div>
      </div>
      <div class="actions">
        <select id="days" class="btn btn-ghost btn-sm" aria-label="Days">
          <option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option>
        </select>
        <button id="refresh" class="btn btn-ghost btn-sm" type="button">Refresh</button>
        <button id="forget" class="btn btn-ghost btn-sm" type="button">Forget code</button>
      </div>
    </div>
    <div id="banner" class="banner hidden"></div>

    <div class="grid kpis" id="kpis"></div>

    <div class="grid two">
      <div class="card">
        <h2 class="card-h">Active PCs and estimated cost per day</h2>
        <div class="legend"><span><b style="background:var(--rose)"></b>Active PCs</span><span><b style="background:var(--cream)"></b>Est. cost (USD)</span></div>
        <div id="chart"></div>
      </div>
      <div class="card">
        <h2 class="card-h">Tiers right now</h2>
        <div class="rows" id="tiers"></div>
      </div>
    </div>

    <div class="grid two">
      <div class="card">
        <h2 class="card-h">Days</h2>
        <div class="table-wrap"><table id="table"></table></div>
      </div>
      <div class="card">
        <h2 class="card-h">What uses it (period)</h2>
        <div class="rows" id="mix"></div>
        <div class="est" id="prices"></div>
      </div>
    </div>
  </section>

</div>
<script src="admin.js"></script>
</body>
</html>
