<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Choochie</title>
<meta name="description" content="Log in to Choochie with Discord, Patreon or X to keep your energy and perks.">
<meta name="theme-color" content="#120c0f">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/nunito.css">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<header id="site-nav"></header>
<main class="page">

<div class="auth-card">
  <div class="panel">
    <h1 id="lg-title">Log in</h1>
    <p class="muted" id="lg-sub">New here? Any login makes your account - with <strong><span id="lg-starter">500</span> starter energy</strong>.</p>
    <div id="lg-attach" hidden class="note good" style="margin-top:16px"></div>
    <div class="providers" id="lg-providers" aria-live="polite">
      <a class="prov discord" data-p="discord" href="#">Continue with Discord</a>
      <a class="prov patreon" data-p="patreon" href="#">Continue with Patreon</a>
      <a class="prov x" data-p="x" href="#">Continue with X</a>
    </div>
    <p class="fine" style="margin-top:16px">18+ only. By continuing you accept the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a> (<a href="privacy.html#signin">what we store</a>).</p>
  </div>
</div>

</main>
<footer id="site-foot"></footer>
<script src="site.js?v=10"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search), dev = q.get("dev") || "";
  const okDev = /^[A-Za-z0-9-]{8,64}$/.test(dev);
  const next = q.get("next") === "chat" ? "chat.html" : "account.html";
  const back = new URL(next, location.href).href;
  const box = $("#lg-providers");
  const wire = a => { const p = a.dataset.p;
    a.innerHTML = ICONS[p] + "<span>Continue with " + PROV_NAMES[p] + "</span>";
    a.href = API + "/pet/ai/auth/start?p=" + encodeURIComponent(p) + "&return=" + encodeURIComponent(back) + (okDev ? "&dev=" + encodeURIComponent(dev) : ""); };
  box.querySelectorAll(".prov").forEach(wire);
  // the server always lands on account.html; remember to hop on to the chat afterwards
  box.addEventListener("click", e => { if (e.target.closest('[aria-disabled="true"]')) { e.preventDefault(); return; } try { next === "chat.html" ? sessionStorage.setItem("choochie.next", "chat") : sessionStorage.removeItem("choochie.next"); } catch (e) {} });
  if (okDev) { $("#lg-title").textContent = "Sign in to Choochie"; $("#lg-sub").innerHTML = "Pick how you log in, and the app on this PC signs in by itself. A brand-new account gets <strong><span id='lg-starter'>500</span> starter energy</strong>, plus a little every day."; }
  // already signed in on this browser + coming from the app: connect this PC in one click
  if (okDev && Auth.signedIn) {
    const at = $("#lg-attach"); at.hidden = false;
    at.innerHTML = `You're already logged in as <strong>${esc(store.get("choochie.name") || "you")}</strong>. <div class="row" style="margin-top:10px"><button class="btn btn-primary btn-sm" id="lg-connect">Connect this PC</button><span class="fine">or pick another login below</span></div>`;
    $("#lg-connect").addEventListener("click", async e => {
      e.target.disabled = true;
      try { await api("/pet/ai/v1/account/attach", { method: "POST", body: { dev } }); location.href = "account.html#app=1"; }
      catch (err) { toast(err.message, true); e.target.disabled = false; }
    });
  }
  // ask the server which logins are switched on (it may be asleep: retry for ~1 minute)
  let j = null;
  for (let i = 0; i < 6 && !j; i++) {
    try { const r = await fetch(API + "/pet/ai/auth/providers"); if (r.ok) j = await r.json(); } catch (e) {}
    if (!j) { if (i === 0) toast("Waking her server up - logins work in a few seconds."); await new Promise(r => setTimeout(r, 8000)); }
  }
  if (!j) return;
  const on = providerMap(j);
  if (j.starter != null && $("#lg-starter")) $("#lg-starter").textContent = j.starter;
  if (on.google && !box.querySelector('[data-p="google"]')) { const a = document.createElement("a"); a.className = "prov google"; a.dataset.p = "google"; box.appendChild(a); wire(a); }
  box.querySelectorAll(".prov").forEach(a => { if (!on[a.dataset.p] && a.dataset.p === "x") { a.hidden = true; return; } if (!on[a.dataset.p]) { a.setAttribute("aria-disabled", "true"); a.tabIndex = -1; a.title = "Not available yet"; a.lastChild.textContent += " (coming soon)"; } });
})();
</script>
</body>
</html>
