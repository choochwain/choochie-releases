<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' https://api.choochie.app https://stream-alerts-bot.onrender.com https://api.github.com https://cdn.jsdelivr.net data: blob:; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Choochie</title>
<meta name="description" content="Log in to Choochie with Discord, Patreon or X to keep your energy and perks.">
<meta name="theme-color" content="#120c0f">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/nunito.css">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<header id="site-nav"></header>
<main class="page">

<div class="auth-card">
  <div class="panel">
    <h1 id="lg-title">Log in</h1>
    <p class="muted" id="lg-sub">New here? Any login makes your account - with a <strong><span id="lg-starter">300</span> energy welcome bonus</strong>.</p>
    <div id="lg-attach" hidden class="note good" style="margin-top:16px"></div>
    <div class="providers" id="lg-providers" aria-live="polite">
      <a class="prov discord" data-p="discord" href="#">Continue with Discord</a>
      <a class="prov patreon" data-p="patreon" href="#">Continue with Patreon</a>
      <a class="prov x" data-p="x" href="#">Continue with X</a>
    </div>
    <p class="fine" style="margin-top:16px">18+ only. By continuing you accept the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a> (<a href="privacy.html#signin">what we store</a>).</p>
  </div>
</div>

</main>
<footer id="site-foot"></footer>
<script src="site.js?v=16"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search), pairT = q.get("pair") || "";
  const okPair = Pair.ok(pairT), oldApp = !okPair && /^[A-Za-z0-9-]{8,64}$/.test(q.get("dev") || "");   // ?dev= = an app from before 0.9.33: signs in, can't link
  if (okPair) { Pair.save(pairT); try { q.delete("pair"); history.replaceState(null, "", location.pathname + (q.toString() ? "?" + q : "")); } catch (e) {} }
  const next = q.get("next") === "chat" ? "chat.html" : "account.html";
  const back = new URL(next, location.href).href;
  const box = $("#lg-providers");
  const wire = a => { const p = a.dataset.p;
    a.innerHTML = ICONS[p] + "<span>Continue with " + PROV_NAMES[p] + "</span>";
    a.href = API + "/pet/ai/auth/start?p=" + encodeURIComponent(p) + "&return=" + encodeURIComponent(back) + (okPair ? "&pair=" + encodeURIComponent(pairT) : ""); };
  box.querySelectorAll(".prov").forEach(wire);
  // the server always lands on account.html; remember to hop on to the chat afterwards
  box.addEventListener("click", e => { if (e.target.closest('[aria-disabled="true"]')) { e.preventDefault(); return; } try { next === "chat.html" ? sessionStorage.setItem("choochie.next", "chat") : sessionStorage.removeItem("choochie.next"); } catch (e) {} });
  // the app sent a one-time pairing token: the PC is linked only after the user confirms its code (here when already signed in,
  // otherwise on the account page right after logging in). A login by itself never links a PC.
  if (okPair) { $("#lg-title").textContent = "Sign in to Choochie"; $("#lg-sub").innerHTML = "Pick how you log in, then confirm the code your app shows to link this PC. A brand-new account gets a <strong><span id='lg-starter'>300</span> energy welcome bonus</strong>."; }
  const at = $("#lg-attach");
  if (okPair && Auth.signedIn) {
    at.hidden = false; at.className = ""; at.style.marginTop = "16px";
    Pair.ask(at, pairT, () => { $("#lg-sub").textContent = "Done - you can close this tab."; });
  } else if (okPair) {
    at.hidden = false; at.className = "note"; at.textContent = "Checking the code from your app…";
    Pair.code(pairT).then(c => { at.innerHTML = `After you log in you'll be asked to link the PC showing the code <strong style="letter-spacing:.08em">${esc(c)}</strong>. Check that it matches Choochie on your screen.`; })
      .catch(e => { if (e.status === 410) { Pair.clear(); at.className = ""; at.innerHTML = Pair.expiredHTML; } else at.textContent = "You'll confirm linking your PC after you log in."; });
  } else if (oldApp) {
    at.hidden = false; at.className = "note warn";
    at.innerHTML = "<strong>Your Choochie app needs an update to link this PC.</strong> You can still log in here. Then update the app (tray menu > Check for updates, or get it from <a href='downloads.html'>Downloads</a>) and press Log in in the app again.";
  }
  // ask the server which logins are switched on (it may be asleep: retry for ~1 minute)
  let j = null;
  for (let i = 0; i < 6 && !j; i++) {
    try { const r = await fetch(API + "/pet/ai/auth/providers"); if (r.ok) j = await r.json(); } catch (e) {}
    if (!j) { if (i === 0) toast("Waking her server up - logins work in a few seconds."); await new Promise(r => setTimeout(r, 8000)); }
  }
  if (!j) return;
  const on = providerMap(j);
  if (j.starter != null && $("#lg-starter")) $("#lg-starter").textContent = j.starter;
  if (on.google && !box.querySelector('[data-p="google"]')) { const a = document.createElement("a"); a.className = "prov google"; a.dataset.p = "google"; box.appendChild(a); wire(a); }
  box.querySelectorAll(".prov").forEach(a => { if (!on[a.dataset.p] && a.dataset.p === "x") { a.hidden = true; return; } if (!on[a.dataset.p]) { a.setAttribute("aria-disabled", "true"); a.tabIndex = -1; a.title = "Not available yet"; a.lastChild.textContent += " (coming soon)"; } });
})();
</script>
</body>
</html>
